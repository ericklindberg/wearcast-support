<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian</title>
  <style>
:root { color-scheme: light dark; --bg: #f8f5f1; --card: #fffaf3; --text: #1f1f1f; --muted: #5f6368; --accent: #c2410c; --line: #e8ded2; }
@media (prefers-color-scheme: dark) { :root { --bg: #171412; --card: #211d1a; --text: #f7efe7; --muted: #c9bdb2; --line: #3a312b; } }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
main { max-width: 860px; margin: 0 auto; padding: 32px 20px 56px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 12px 32px rgba(31,31,31,.06); }
h1 { line-height: 1.1; margin-top: 0; }
h2 { margin-top: 32px; line-height: 1.2; }
a { color: var(--accent); }
.meta, .footer { color: var(--muted); font-size: .95rem; }
.footer { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 16px; }
ul { padding-left: 1.3rem; }
nav { margin-bottom: 18px; }
nav a { margin-right: 16px; }
</style>
</head>
<body>
<main>
  <article class="card">
    <h1>Meridian</h1>
    <p>Meridian is a warm, calm life-management app for quick capture, tasks, projects, notes, reminders, journal prompts, widgets, and Apple Watch capture.</p>
    <ul>
      <li><a href="./privacy.html">Privacy Policy</a></li>
      <li><a href="./support.html">Support</a></li>
    </ul>
  </article>
</main>
</body>
</html>
